<script>
const P=JSON.parse(document.getElementById('blob').textContent);
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(P.iv)},key,b2a(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); const b=document.getElementById('b'),e=document.getElementById('e'); e.textContent=''; b.disabled=true; b.textContent='확인 중…';
  try{ const html=await open(document.getElementById('pw').value); document.open(); document.write(html); document.close(); }
  catch(err){ e.textContent='비밀번호가 맞지 않습니다. 다시 확인해 주세요.'; b.disabled=false; b.textContent='보고서 열기'; }
});
